<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prontuário Médico Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .ficha-card { border-left: 5px solid #0d6efd; margin-bottom: 15px; }
        .header-app { background: #0d6efd; color: white; padding: 15px; border-radius: 0 0 15px 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(13,110,253,0.2); position: relative;}
    </style>
</head>
<body>

<div class="container-fluid pb-5">
    <div class="header-app text-center">
        <h4 class="m-0">Triagem</h4>
        <div id="nomeGrupoLabel" class="mt-1 small fw-bold text-light"></div>
        <button id="btnSair" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-3">Sair</button>
    </div>

    <!-- Formulário -->
    <div class="card p-4">
        <h5 class="mb-3">Nova Ficha</h5>
        <form id="fichaForm">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Identificação / Paciente</label>
                <input type="text" class="form-control" id="identificacao" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label text-muted small fw-bold">Pressão (PA)</label>
                    <input type="text" class="form-control" id="pa" placeholder="120x80" required>
                </div>
                <div class="col-6">
                    <label class="form-label text-muted small fw-bold">Freq. Cardíaca (FC)</label>
                    <input type="number" class="form-control" id="fc" placeholder="bpm" required>
                </div>
                <div class="col-6">
                    <label class="form-label text-muted small fw-bold">Temperatura (°C)</label>
                    <input type="number" step="0.1" class="form-control" id="temperatura" required>
                </div>
                <div class="col-6">
                    <label class="form-label text-muted small fw-bold">Saturação (O2)</label>
                    <input type="text" class="form-control" id="o2" placeholder="98%" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Mecanismo da Lesão</label>
                <input type="text" class="form-control" id="mecanismoLesao">
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Principais Lesões</label>
                <input type="text" class="form-control" id="principaisLesoes">
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Medicações / Intervenções</label>
                <textarea class="form-control" id="medicacoes" rows="2"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnSalvar">Salvar Prontuário</button>
        </form>
    </div>

    <!-- Lista de Fichas -->
    <h5 class="mb-3 text-secondary px-2">Registros Recentes</h5>
    <div id="listaFichas">
        <!-- Preenchido via JS -->
    </div>
</div>

<!-- Modal de Detalhes -->
<div class="modal fade" id="detalhesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Detalhes do Prontuário</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modalDetalhesBody">
                <!-- Preenchido via JS -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-success" id="btnImprimirPdf">📄 Salvar em PDF</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS para o funcionamento do Modal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const grupoLogado = localStorage.getItem('grupoAtendimento');
    if (!grupoLogado) {
        window.location.replace('login.html');
    } else {
        document.getElementById('nomeGrupoLabel').innerText = `Equipe: ${grupoLogado}`;
    }

    // Amarra a função de apagar a memória diretamente ao clique do botão
    document.getElementById('btnSair').addEventListener('click', () => {
        localStorage.removeItem('grupoAtendimento');
        window.location.replace('login.html');
    });

    // URL da API
    const API_URL = 'https://celery-hash-retired.ngrok-free.dev/api/fichas';
    let fichasEmMemoria = []; // Guarda as fichas para exibir os detalhes sem precisar ir no banco de novo
    let fichaAtualModal = null;

    async function carregarFichas() {
        try {
            const response = await fetch(API_URL, {
                headers: { 'ngrok-skip-browser-warning': 'true' }
            });
            if (!response.ok) throw new Error("Erro na rede");

            const fichas = await response.json();
            fichasEmMemoria = fichas; // Salva em memória
            const lista = document.getElementById('listaFichas');

            lista.innerHTML = fichas.reverse().map(f => `
                <div class="card p-3 ficha-card">
                    <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                        <strong class="text-dark">ID #${f.id} -${f.identificacao}</strong>
                        <span class="badge bg-secondary">${f.grupoResponsavel || 'Geral'}</span>
                    </div>
                    <div class="row text-muted small mb-2">
                        <div class="col-6"><strong>PA:</strong> ${f.pa}</div>
                        <div class="col-6"><strong>FC:</strong> ${f.fc} bpm</div>
                        <div class="col-6 mt-1"><strong>Temp:</strong> ${f.temperatura}°C</div>
                        <div class="col-6 mt-1"><strong>O2:</strong> ${f.o2}</div>
                    </div>
                    <div class="d-flex justify-content-end border-top pt-2">
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="abrirDetalhes(${f.id})">👁️ Detalhes</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="apagarFicha(${f.id})">🗑️ Apagar</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error("Erro ao buscar fichas:", error);
            document.getElementById('listaFichas').innerHTML = '<div class="alert alert-danger">Falha ao conectar com o servidor. A API pode estar hibernando, aguarde 30s e recarregue.</div>';
        }
    }

    // Função para APAGAR o prontuário
    async function apagarFicha(id) {
        if (!confirm("Tem certeza que deseja apagar este prontuário permanentemente?")) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE',
                headers: { 'ngrok-skip-browser-warning': 'true' }
            });

            if (response.ok) {
                carregarFichas(); // Recarrega a lista após excluir
            } else {
                alert("Erro ao excluir a ficha. Verifique o servidor.");
            }
        } catch (error) {
            alert("Erro de conexão ao tentar excluir.");
        }
    }

    // Função para ABRIR O MODAL com detalhes
    function abrirDetalhes(id) {
        fichaAtualModal = fichasEmMemoria.find(f => f.id === id);
        if (!fichaAtualModal) return;

        const htmlDetalhes = `
            <div class="mb-3 border-bottom pb-2">
                <h6 class="text-primary mb-1">Identificação do Paciente</h6>
                <p class="mb-0 fs-5">${fichaAtualModal.identificacao}</p>
                <small class="text-muted">Equipe de Triagem: ${fichaAtualModal.grupoResponsavel}</small>
            </div>
            <div class="row mb-3 border-bottom pb-2">
                <h6 class="text-primary mb-2">Sinais Vitais</h6>
                <div class="col-6 col-md-3"><strong>PA:</strong> <br>${fichaAtualModal.pa}</div>
                <div class="col-6 col-md-3"><strong>FC:</strong> <br>${fichaAtualModal.fc} bpm</div>
                <div class="col-6 col-md-3 mt-2 mt-md-0"><strong>Temp:</strong> <br>${fichaAtualModal.temperatura}°C</div>
                <div class="col-6 col-md-3 mt-2 mt-md-0"><strong>Sat O2:</strong> <br>${fichaAtualModal.o2}</div>
            </div>
            <div class="mb-3 border-bottom pb-2">
                <h6 class="text-primary mb-1">Mecanismo da Lesão</h6>
                <p class="mb-0">${fichaAtualModal.mecanismoLesao || 'Não informado'}</p>
            </div>
            <div class="mb-3 border-bottom pb-2">
                <h6 class="text-primary mb-1">Principais Lesões</h6>
                <p class="mb-0">${fichaAtualModal.principaisLesoes || 'Não informado'}</p>
            </div>
            <div class="mb-3">
                <h6 class="text-primary mb-1">Medicações e Intervenções</h6>
                <p class="mb-0">${fichaAtualModal.medicacoes || 'Não informado'}</p>
            </div>
        `;

        document.getElementById('modalDetalhesBody').innerHTML = htmlDetalhes;
        const modal = new bootstrap.Modal(document.getElementById('detalhesModal'));
        modal.show();
    }

    // Função para GERAR PDF e Imprimir
    document.getElementById('btnImprimirPdf').addEventListener('click', () => {
        if (!fichaAtualModal) return;

        // Abre uma nova aba com um HTML limpo próprio para impressão
        const janelaPdf = window.open('', '', 'width=800,height=900');
        janelaPdf.document.write(`
            <html>
                <head>
                    <title>Prontuário_ID_${fichaAtualModal.id}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 40px; color: #333; }
                        h2 { text-align: center; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; }
                        .info-group { margin-bottom: 20px; }
                        .label { font-weight: bold; color: #555; font-size: 14px; }
                        .value { font-size: 18px; display: block; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ddd; padding: 10px; border-radius: 5px; background: #f9f9f9; }
                        .row { display: flex; justify-content: space-between; gap: 20px; }
                        .col { flex: 1; }
                    </style>
                </head>
                <body>
                    <h2>Ficha de Atendimento Pré-Hospitalar (ID: ${fichaAtualModal.id})</h2>
                    <div class="info-group">
                        <span class="label">Paciente:</span>
                        <span class="value">${fichaAtualModal.identificacao}</span>
                        <span class="label">Equipe Responsável:</span>
                        <span class="value">${fichaAtualModal.grupoResponsavel}</span>
                    </div>

                    <div class="row info-group">
                        <div class="col"><span class="label">Pressão (PA):</span><span class="value">${fichaAtualModal.pa}</span></div>
                        <div class="col"><span class="label">Frequência Cardíaca (FC):</span><span class="value">${fichaAtualModal.fc} bpm</span></div>
                        <div class="col"><span class="label">Temperatura:</span><span class="value">${fichaAtualModal.temperatura}°C</span></div>
                        <div class="col"><span class="label">Saturação O2:</span><span class="value">${fichaAtualModal.o2}</span></div>
                    </div>

                    <div class="info-group">
                        <span class="label">Mecanismo da Lesão:</span>
                        <span class="value">${fichaAtualModal.mecanismoLesao || 'N/A'}</span>
                    </div>
                    <div class="info-group">
